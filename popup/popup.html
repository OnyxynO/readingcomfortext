<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReadingComfortExt</title>
  <style>
    :root {
      --bg: #FDF6E3;
      --bg-panel: #FFFEFB;
      --text: #2C3E50;
      --text-muted: #5D6D7E;
      --accent: #2E86AB;
      --accent-hover: #1F618D;
      --border: #E5DDC8;
      --badge-sci: #27AE60;
      --badge-pref: #E67E22;
      --danger: #C0392B;
    }

    * {
      box-sizing: border-box;
    }

    body {
      width: 340px;
      margin: 0;
      padding: 16px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      color: var(--text);
      background: var(--bg);
    }

    h1 {
      margin: 0 0 12px 0;
      font-size: 18px;
      font-weight: 700;
    }

    h2 {
      margin: 16px 0 8px 0;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 12px;
    }

    .switch-row label {
      font-weight: 600;
    }

    .toggle {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #BDC3C7;
      transition: 0.2s;
      border-radius: 24px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.2s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--accent);
    }

    input:checked + .slider:before {
      transform: translateX(20px);
    }

    .option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      margin: 4px 0;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .option:hover {
      border-color: var(--accent);
    }

    .option input {
      margin-right: 8px;
    }

    .option-label {
      display: flex;
      align-items: center;
      flex: 1;
    }

    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      color: white;
      white-space: nowrap;
    }

    .badge-sci {
      background-color: var(--badge-sci);
    }

    .badge-pref {
      background-color: var(--badge-pref);
    }

    .slider-control {
      margin: 10px 0;
      padding: 10px 12px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .slider-control label {
      display: flex;
      justify-content: space-between;
      font-weight: 500;
      margin-bottom: 6px;
    }

    .slider-control input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    .slider-value {
      font-weight: 600;
      color: var(--accent);
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    button {
      flex: 1;
      padding: 10px 12px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-secondary {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: var(--bg-panel);
      color: var(--text);
    }

    .footer {
      margin-top: 12px;
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
    }

    .footer a {
      color: var(--accent);
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <h1>ReadingComfortExt</h1>

  <div class="switch-row">
    <label for="enabled">Activer sur ce site</label>
    <label class="toggle">
      <input type="checkbox" id="enabled" checked>
      <span class="slider"></span>
    </label>
  </div>

  <h2>Police</h2>
  <div id="font-options" role="radiogroup" aria-label="Choix de la police">
    <label class="option">
      <span class="option-label">
        <input type="radio" name="font" value="default" checked>
        Police du site (défaut)
      </span>
    </label>
    <label class="option">
      <span class="option-label">
        <input type="radio" name="font" value="lexend">
        Lexend
      </span>
      <span class="badge badge-sci" title="Soutenu par la recherche">Sci ✓</span>
    </label>
    <label class="option">
      <span class="option-label">
        <input type="radio" name="font" value="atkinson">
        Atkinson Hyperlegible
      </span>
      <span class="badge badge-sci" title="Soutenu par la recherche">Sci ✓</span>
    </label>
    <label class="option">
      <span class="option-label">
        <input type="radio" name="font" value="opendyslexic">
        OpenDyslexic
      </span>
      <span class="badge badge-pref" title="Préférence subjective documentée">Pref</span>
    </label>
  </div>

  <h2>Espacement</h2>
  <div class="slider-control">
    <label>
      Espace entre les lettres
      <span class="slider-value" id="letter-spacing-value">0 px</span>
    </label>
    <input type="range" id="letter-spacing" min="0" max="6" step="0.5" value="0">
  </div>
  <div class="slider-control">
    <label>
      Hauteur de ligne
      <span class="slider-value" id="line-height-value">1.5</span>
    </label>
    <input type="range" id="line-height" min="1" max="2.5" step="0.1" value="1.5">
  </div>
  <div class="slider-control">
    <label>
      Largeur max. du texte
      <span class="slider-value" id="max-width-value">auto</span>
    </label>
    <input type="range" id="max-width" min="0" max="900" step="50" value="0">
  </div>

  <h2>Présentation</h2>
  <label class="option">
    <span class="option-label">
      <input type="checkbox" id="cream-background">
      Fond crème
    </span>
    <span class="badge badge-sci">Sci ✓</span>
  </label>
  <label class="option">
    <span class="option-label">
      <input type="checkbox" id="no-justify">
      Texte non justifié
    </span>
    <span class="badge badge-sci">Sci ✓</span>
  </label>

  <h2>Guide visuel</h2>
  <div id="guide-options" role="radiogroup" aria-label="Guide visuel">
    <label class="option">
      <span class="option-label">
        <input type="radio" name="guide" value="none" checked>
        Aucun
      </span>
    </label>
    <label class="option">
      <span class="option-label">
        <input type="radio" name="guide" value="colored-lines">
        Lignes colorées
      </span>
      <span class="badge badge-sci">Sci ✓</span>
    </label>
  </div>

  <h2>Lecture audio</h2>
  <div class="actions">
    <button id="tts-play" class="btn-primary">▶ Lire la sélection</button>
    <button id="tts-stop" class="btn-secondary hidden">⏹ Arrêter</button>
  </div>

  <div class="actions">
    <button id="reset" class="btn-secondary">Réinitialiser</button>
  </div>

  <p class="footer">
    <a href="#" id="open-science">Pourquoi Sci ✓ / Pref ?</a> ·
    <a href="#" id="open-privacy">Confidentialité</a>
  </p>

  <script src="popup.js"></script>
</body>
</html>
